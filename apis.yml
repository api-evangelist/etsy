- aid: etsy:webhooks
  name: Etsy Open API v3 Webhooks
  description: >-
    AsyncAPI 2.6 description of Etsy's outbound webhook surface for the Open API v3. Covers the four documented
    event types (order.paid, order.canceled, order.shipped, order.delivered), the common webhook envelope
    (event_type, resource_url, shop_id), the signing headers (webhook-id, webhook-timestamp, webhook-signature),
    HMAC-SHA256 signature verification procedure, and Etsy's documented retry schedule.
  humanURL: https://developers.etsy.com/documentation/essentials/webhooks
  tags:
  - Webhook
