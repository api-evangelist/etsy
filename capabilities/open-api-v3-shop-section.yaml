naftiko: 1.0.0-alpha2
info:
  label: Etsy Open API v3 — Shop Section
  description: 'Etsy Open API v3 — Shop Section. 5 operations. Lead operation: Create Shop Section. Self-contained Naftiko capability covering one Etsy business surface.'
  tags:
    - Etsy
    - Open API v3
    - Shop Section
  created: '2026-05-30'
  modified: '2026-05-30'
binds:
  - namespace: env
    keys:
      ETSY_API_KEY: ETSY_API_KEY
      ETSY_OAUTH_TOKEN: ETSY_OAUTH_TOKEN
capability:
  consumes:
    - type: http
      namespace: open-api-v3-shop-section
      baseUri: https://openapi.etsy.com
      description: Etsy Open API v3 — Shop Section business capability. Self-contained, no shared references.
      authentication:
        type: apikey
        key: x-api-key
        value: '{{env.ETSY_API_KEY}}'
        placement: header
      resources:
        - name: shops-sections
          path: /v3/application/shops/{shop_id}/sections
          operations:
            - name: createShopSection
              method: POST
              description: Create Shop Section
              inputParameters:
                - name: shop_id
                  in: path
                  type: integer
                  required: true
                  description: The unique positive non-zero numeric ID for an Etsy Shop.
                - name: body
                  in: body
                  type: object
                  required: false
                  description: JSON request body.
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: $.
            - name: getShopSections
              method: GET
              description: Get Shop Sections
              inputParameters:
                - name: shop_id
                  in: path
                  type: integer
                  required: true
                  description: The unique positive non-zero numeric ID for an Etsy Shop.
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: $.
        - name: shops-sections
          path: /v3/application/shops/{shop_id}/sections/{shop_section_id}
          operations:
            - name: deleteShopSection
              method: DELETE
              description: Delete Shop Section
              inputParameters:
                - name: shop_id
                  in: path
                  type: integer
                  required: true
                  description: The unique positive non-zero numeric ID for an Etsy Shop.
                - name: shop_section_id
                  in: path
                  type: integer
                  required: true
                  description: The numeric ID of a section in a specific Etsy shop.
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: $.
            - name: getShopSection
              method: GET
              description: Get Shop Section
              inputParameters:
                - name: shop_id
                  in: path
                  type: integer
                  required: true
                  description: The unique positive non-zero numeric ID for an Etsy Shop.
                - name: shop_section_id
                  in: path
                  type: integer
                  required: true
                  description: The numeric ID of a section in a specific Etsy shop.
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: $.
            - name: updateShopSection
              method: PUT
              description: Update Shop Section
              inputParameters:
                - name: shop_id
                  in: path
                  type: integer
                  required: true
                  description: The unique positive non-zero numeric ID for an Etsy Shop.
                - name: shop_section_id
                  in: path
                  type: integer
                  required: true
                  description: The numeric ID of a section in a specific Etsy shop.
                - name: body
                  in: body
                  type: object
                  required: false
                  description: JSON request body.
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: $.
  exposes:
    - type: rest
      namespace: open-api-v3-shop-section-rest
      port: 8080
      description: REST adapter for Etsy Open API v3 — Shop Section. One Spectral-compliant resource per consumed operation, prefixed with /v1.
      resources:
        - path: /v1/shops/{shop_id}/sections
          name: shops-sections
          description: REST surface for shops-sections.
          operations:
            - method: POST
              name: createShopSection
              description: Create Shop Section
              call: open-api-v3-shop-section.createShopSection
              with:
                shop_id: rest.shop_id
                body: rest.body
              outputParameters:
                - type: object
                  mapping: $.
            - method: GET
              name: getShopSections
              description: Get Shop Sections
              call: open-api-v3-shop-section.getShopSections
              with:
                shop_id: rest.shop_id
              outputParameters:
                - type: object
                  mapping: $.
        - path: /v1/shops/{shop_id}/sections/{shop_section_id}
          name: shops-sections
          description: REST surface for shops-sections.
          operations:
            - method: DELETE
              name: deleteShopSection
              description: Delete Shop Section
              call: open-api-v3-shop-section.deleteShopSection
              with:
                shop_id: rest.shop_id
                shop_section_id: rest.shop_section_id
              outputParameters:
                - type: object
                  mapping: $.
            - method: GET
              name: getShopSection
              description: Get Shop Section
              call: open-api-v3-shop-section.getShopSection
              with:
                shop_id: rest.shop_id
                shop_section_id: rest.shop_section_id
              outputParameters:
                - type: object
                  mapping: $.
            - method: PUT
              name: updateShopSection
              description: Update Shop Section
              call: open-api-v3-shop-section.updateShopSection
              with:
                shop_id: rest.shop_id
                shop_section_id: rest.shop_section_id
                body: rest.body
              outputParameters:
                - type: object
                  mapping: $.
    - type: mcp
      namespace: open-api-v3-shop-section-mcp
      port: 9090
      transport: http
      description: MCP adapter for Etsy Open API v3 — Shop Section. One tool per consumed operation, routed inline through this capability's consumes block.
      tools:
        - name: create-shop-section
          description: Create Shop Section
          hints:
            readOnly: false
            destructive: false
            idempotent: false
          call: open-api-v3-shop-section.createShopSection
          with:
            shop_id: tools.shop_id
            body: tools.body
          outputParameters:
            - type: object
              mapping: $.
        - name: get-shop-sections
          description: Get Shop Sections
          hints:
            readOnly: true
            destructive: false
            idempotent: true
          call: open-api-v3-shop-section.getShopSections
          with:
            shop_id: tools.shop_id
          outputParameters:
            - type: object
              mapping: $.
        - name: delete-shop-section
          description: Delete Shop Section
          hints:
            readOnly: false
            destructive: true
            idempotent: true
          call: open-api-v3-shop-section.deleteShopSection
          with:
            shop_id: tools.shop_id
            shop_section_id: tools.shop_section_id
          outputParameters:
            - type: object
              mapping: $.
        - name: get-shop-section
          description: Get Shop Section
          hints:
            readOnly: true
            destructive: false
            idempotent: true
          call: open-api-v3-shop-section.getShopSection
          with:
            shop_id: tools.shop_id
            shop_section_id: tools.shop_section_id
          outputParameters:
            - type: object
              mapping: $.
        - name: update-shop-section
          description: Update Shop Section
          hints:
            readOnly: false
            destructive: false
            idempotent: true
          call: open-api-v3-shop-section.updateShopSection
          with:
            shop_id: tools.shop_id
            shop_section_id: tools.shop_section_id
            body: tools.body
          outputParameters:
            - type: object
              mapping: $.
