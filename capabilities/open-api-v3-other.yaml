naftiko: 1.0.0-alpha2
info:
  label: Etsy Open API v3 — Other
  description: 'Etsy Open API v3 — Other. 2 operations. Lead operation: Ping. Self-contained Naftiko capability covering one Etsy business surface.'
  tags:
    - Etsy
    - Open API v3
    - Other
  created: '2026-05-30'
  modified: '2026-05-30'
binds:
  - namespace: env
    keys:
      ETSY_API_KEY: ETSY_API_KEY
      ETSY_OAUTH_TOKEN: ETSY_OAUTH_TOKEN
capability:
  consumes:
    - type: http
      namespace: open-api-v3-other
      baseUri: https://openapi.etsy.com
      description: Etsy Open API v3 — Other business capability. Self-contained, no shared references.
      authentication:
        type: apikey
        key: x-api-key
        value: '{{env.ETSY_API_KEY}}'
        placement: header
      resources:
        - name: openapi-ping
          path: /v3/application/openapi-ping
          operations:
            - name: ping
              method: GET
              description: Ping
              inputParameters: []
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: $.
        - name: scopes
          path: /v3/application/scopes
          operations:
            - name: tokenScopes
              method: POST
              description: Token Scopes
              inputParameters:
                - name: body
                  in: body
                  type: object
                  required: false
                  description: JSON request body.
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: $.
  exposes:
    - type: rest
      namespace: open-api-v3-other-rest
      port: 8080
      description: REST adapter for Etsy Open API v3 — Other. One Spectral-compliant resource per consumed operation, prefixed with /v1.
      resources:
        - path: /v1/openapi-ping
          name: openapi-ping
          description: REST surface for openapi-ping.
          operations:
            - method: GET
              name: ping
              description: Ping
              call: open-api-v3-other.ping
              with: {}
              outputParameters:
                - type: object
                  mapping: $.
        - path: /v1/scopes
          name: scopes
          description: REST surface for scopes.
          operations:
            - method: POST
              name: tokenScopes
              description: Token Scopes
              call: open-api-v3-other.tokenScopes
              with:
                body: rest.body
              outputParameters:
                - type: object
                  mapping: $.
    - type: mcp
      namespace: open-api-v3-other-mcp
      port: 9090
      transport: http
      description: MCP adapter for Etsy Open API v3 — Other. One tool per consumed operation, routed inline through this capability's consumes block.
      tools:
        - name: ping
          description: Ping
          hints:
            readOnly: true
            destructive: false
            idempotent: true
          call: open-api-v3-other.ping
          with: {}
          outputParameters:
            - type: object
              mapping: $.
        - name: token-scopes
          description: Token Scopes
          hints:
            readOnly: false
            destructive: false
            idempotent: false
          call: open-api-v3-other.tokenScopes
          with:
            body: tools.body
          outputParameters:
            - type: object
              mapping: $.
