      tags:
      - UserAddress
      parameters:
      - name: user_address_id
        in: path
        description: The numeric ID of the user's address.
        required: true
        schema:
          type: integer
          description: The numeric ID of the user's address.
          format: int64
          minimum: 1
        example: 1
      responses:
        '204':
          description: The User Address resource was correctly deleted
        '400':
          description: There was a problem with the request data. See the error message for details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorSchema'
              examples:
                DeleteUserAddress400Example:
                  summary: Default deleteUserAddress 400 response
                  x-microcks-default: true
                  value:
                    error: example string
        '401':
          description: The request lacks valid authentication credentials. See the error message for details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorSchema'
              examples:
                DeleteUserAddress401Example:
                  summary: Default deleteUserAddress 401 response
                  x-microcks-default: true
                  value:
                    error: example string
        '500':
          description: The server encountered an internal error. See the error message for details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorSchema'
              examples:
                DeleteUserAddress500Example:
                  summary: Default deleteUserAddress 500 response
                  x-microcks-default: true
                  value:
                    error: example string
      security:
      - api_key: []
        oauth2:
        - address_r
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      summary: Etsy Delete User Address
