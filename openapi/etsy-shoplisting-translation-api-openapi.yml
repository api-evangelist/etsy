      properties:
        listing_id:
          type: integer
          description: The numeric ID for the Listing.
          format: int64
          minimum: 1
          example: 123456789
        language:
          type: string
          description: The IETF language tag (e.g. 'fr') for the language of this translation.
          example: en-US
        title:
          type: string
          description: The title of the Listing of this Translation.
          nullable: true
          example: Handmade Ceramic Mug — Stoneware
        description:
