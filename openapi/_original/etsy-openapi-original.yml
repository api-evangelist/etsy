  /v3/application/shops/{shop_id}/shipping-profiles/{shipping_profile_id}/destinations:
    post:
      operationId: createShopShippingProfileDestination
      description: "<div class=\"wt-display-flex-xs wt-align-items-center wt-mt-xs-2 wt-mb-xs-3\"><span class=\"wt-badge wt-badge--notificationPrimary wt-bg-slime-tint wt-mr-xs-2\">General Release</span><a class=\"wt-text-link\" href=\"https://github.com/etsy/open-api/discussions\" target=\"_blank\" rel=\"noopener noreferrer\">Report bug</a></div><div class=\"wt-display-flex-xs wt-align-items-center wt-mt-xs-2 wt-mb-xs-3\"><p class=\"wt-text-body-01 banner-text\">This endpoint is ready for production use.</p></div>\n\nCreates a new shipping destination, which sets the shipping cost, carrier, and class for a destination in a [shipping profile](/documentation/reference/#tag/Shop-ShippingProfile). createShopShippingProfileDestination assigns costs using the currency of the associated shop. Set the destination using either `destination_country_iso` or `destination_region`; `destination_country_iso` and `destination_region` are mutually exclusive — set one or the other. Setting both triggers error 400. If the request sets neither `destination_country_iso` nor `destination_region`, the default destination is \"everywhere\". You must also either assign both a `shipping_carrier_id` AND `mail_class` or both `min_delivery_days` AND `max_delivery_days`."
      tags:
        - Shop ShippingProfile
      parameters:
        - name: shop_id
          in: path
          description: The unique positive non-zero numeric ID for an Etsy Shop.
          required: true
          schema:
            type: integer
            description: The unique positive non-zero numeric ID for an Etsy Shop.
            format: int64
            minimum: 1
          example: 123456
        - name: shipping_profile_id
          in: path
          description: The numeric ID of the [shipping profile](/documentation/reference#operation/getShopShippingProfile) associated with the listing. Required when listing type is `physical`.
          required: true
          schema:
            type: integer
            description: The numeric ID of the [shipping profile](/documentation/reference#operation/getShopShippingProfile) associated with the listing. Required when listing type is `physical`.
            format: int64
            minimum: 1
          example: 1
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - primary_cost
                - secondary_cost
              properties:
                primary_cost:
                  type: number
                  description: The cost of shipping to this country/region alone, measured in the store's default currency.
                  format: float
                  minimum: 0
                secondary_cost:
                  type: number
                  description: The cost of shipping to this country/region with another item, measured in the store's default currency.
                  format: float
                  minimum: 0
                destination_country_iso:
                  type: string
                  description: The ISO code of the country to which the listing ships. If null, request sets destination to destination_region. Required if destination_region is null or not provided.
                  format: ISO 3166-1 alpha-2
                  default:
                destination_region:
                  type: string
                  description: The code of the region to which the listing ships. A region represents a set of countries. Supported regions are Europe Union and Non-Europe Union (countries in Europe not in EU). If `none`, request sets destination to destination_country_iso. Required if destination_country_iso is null or not provided.
                  enum:
                    - eu
                    - non_eu
                    - none
                  default: none
                shipping_carrier_id:
                  type: integer
                  description: The unique ID of a supported shipping carrier, which is used to calculate an Estimated Delivery Date. **Required with `mail_class`** if `min_delivery_days` and `max_delivery_days` are null.
                  minimum: 0
                  default: 0
                mail_class:
                  type: string
                  description: The unique ID string of a shipping carrier's mail class, which is used to calculate an estimated delivery date. **Required with `shipping_carrier_id`** if `min_delivery_days` and `max_delivery_days` are null.
                  default:
                min_delivery_days:
                  type: integer
                  description: The minimum number of business days a buyer can expect to wait to receive their purchased item once it has shipped. **Required with `max_delivery_days`** if `mail_class` is null.
                  minimum: 1
                  maximum: 45
                  default:
                max_delivery_days:
                  type: integer
                  description: The maximum number of business days a buyer can expect to wait to receive their purchased item once it has shipped. **Required with `min_delivery_days`** if `mail_class` is null.
                  minimum: 1
                  maximum: 45
                  default:
            examples:
              CreateShopShippingProfileDestinationRequestExample:
                summary: Default createShopShippingProfileDestination request
                x-microcks-default: true
                value:
                  primary_cost: 1.0
                  secondary_cost: 1.0
                  destination_country_iso: example string
                  destination_region: eu
                  shipping_carrier_id: 1
                  mail_class: example string
                  min_delivery_days: 1
                  max_delivery_days: 1
      responses:
        '201':
          description: A single shipping destination.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShopShippingProfileDestination'
              examples:
                CreateShopShippingProfileDestination201Example:
                  summary: Default createShopShippingProfileDestination 201 response
                  x-microcks-default: true
                  value:
                    shipping_profile_destination_id: 1
                    shipping_profile_id: 1
                    origin_country_iso: US
                    destination_country_iso: US
                    destination_region: eu
                    primary_cost: example
                    secondary_cost: example
                    shipping_carrier_id: 1
                    mail_class: example string
                    min_delivery_days: 1
                    max_delivery_days: 1
        '400':
          description: There was a problem with the request data. See the error message for details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorSchema'
              examples:
                CreateShopShippingProfileDestination400Example:
                  summary: Default createShopShippingProfileDestination 400 response
                  x-microcks-default: true
                  value:
                    error: example string
        '403':
