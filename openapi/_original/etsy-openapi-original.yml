  /v3/application/shops/{shop_id}/receipts/{receipt_id}/tracking:
    post:
      operationId: createReceiptShipment
      description: "<div class=\"wt-display-flex-xs wt-align-items-center wt-mt-xs-2 wt-mb-xs-3\"><span class=\"wt-badge wt-badge--notificationPrimary wt-bg-slime-tint wt-mr-xs-2\">General Release</span><a class=\"wt-text-link\" href=\"https://github.com/etsy/open-api/discussions\" target=\"_blank\" rel=\"noopener noreferrer\">Report bug</a></div><div class=\"wt-display-flex-xs wt-align-items-center wt-mt-xs-2 wt-mb-xs-3\"><p class=\"wt-text-body-01 banner-text\">This endpoint is ready for production use.</p></div>\n\nSubmits tracking information for a Shop Receipt, which creates a Shop Receipt Shipment entry for the given receipt_id. Each time you successfully submit tracking info, Etsy sends a notification email to the buyer User. When send_bcc is true, Etsy sends shipping notifications to the seller as well. When tracking_code and carrier_name aren't sent, the receipt is marked as shipped only. If the carrier is not supported, you may use `other` as the carrier name so you can provide the tracking code. **NOTES** When shipping within the United States AND the order is over $10 _or_ when shipping to India, tracking code and carrier name ARE required. Access to ShopReceipt's first_line, second_line, city, state, zip, country_iso and formatted_address is contingent in some regions to a preferred partnership status with Etsy"
      tags:
        - Shop Receipt
      parameters:
        - name: shop_id
          in: path
          description: The unique positive non-zero numeric ID for an Etsy Shop.
          required: true
          schema:
            type: integer
            description: The unique positive non-zero numeric ID for an Etsy Shop.
            format: int64
            minimum: 1
          example: 123456
        - name: receipt_id
          in: path
          description: The receipt to submit tracking for.
          required: true
          schema:
            type: integer
            description: The receipt to submit tracking for.
            format: int64
            minimum: 1
          example: 234567890
        - name: legacy
          in: query
          description: This parameter needed to enable new parameters and response values related to processing profiles.
          required: false
          schema:
            type: boolean
            description: This parameter needed to enable new parameters and response values related to processing profiles.
          example: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                tracking_code:
                  type: string
                  description: The tracking code for this receipt.
                carrier_name:
                  type: string
                  description: The carrier name for this receipt.
                send_bcc:
                  type: boolean
                  description: If true, the shipping notification will be sent to the seller as well
                note_to_buyer:
                  type: string
                  description: Message to include in notification to the buyer.
                mail_class:
                  type: string
                  description: The service level of postal or carrier service selected for the shipment (e.g., First-Class, Priority, Ground, Express).
                  nullable: true
                weight:
                  type: number
                  description: The total weight of the package.
                  format: float
                  nullable: true
                weight_units:
                  type: string
                  description: Unit of measurement used for package weight (oz, grams, etc.).
                  nullable: true
                length:
                  type: number
                  description: Longest side of the package.
                  format: float
                  nullable: true
                width:
                  type: number
                  description: Second longest side of the package.
                  format: float
                  nullable: true
                height:
                  type: number
                  description: Third longest side of the package.
                  format: float
                  nullable: true
                dimension_units:
                  type: string
                  description: Unit of measurement used for package dimensions (in, cm...).
                  nullable: true
                shipping_label_cost:
                  type: number
                  description: The purchase price the seller paid for the shipping label.
                  format: float
                  nullable: true
                shipping_label_currency:
                  type: string
                  description: The currency in which the shipping label was purchased.
                  nullable: true
                revenue_eligibility:
                  type: string
                  description: A flag indicating if the shipment is tied to a revenue share agreement between Etsy and the vendor.
                  nullable: true
                ship_from_country:
                  type: string
                  description: Where the package ships from.
                  nullable: true
                ship_to_country:
                  type: string
                  description: Package destination.
                  nullable: true
                incoterm:
                  type: string
                  description: The specific incoterm (e.g., DDU, DDP) designated for the shipment.
                  nullable: true
                customs_data:
                  type: array
                  description: Contains custom data like country of origin, declared value and HS code.
                  nullable: true
                  items:
                    type: object
                    properties:
                      country_of_origin:
                        type: string
                        description: The country in which the goods originate from.
                        nullable: true
                        default:
                      declared_value:
                        type: number
                        description: The commercial value of the goods.
                        format: float
                        nullable: true
                        default:
                      HS_code:
                        type: string
                        description: The standardized global system (Harmonized System) for classifying traded products.
                        nullable: true
                        default:
                    required:
                      - country_of_origin
                      - declared_value
                      - HS_code
                duty_amount:
                  type: number
                  description: The estimated or actual amount of import duties and taxes assessed by customs for the shipment.
                  format: float
                  nullable: true
                duty_currency:
                  type: string
                  description: The currency in which the duty was paid.
                  nullable: true
                ship_date:
                  type: string
                  description: The date package was shipped.
                  nullable: true
            examples:
              CreateReceiptShipmentRequestExample:
                summary: Default createReceiptShipment request
                x-microcks-default: true
                value:
                  tracking_code: example string
                  carrier_name: example string
                  send_bcc: true
                  note_to_buyer: example string
                  mail_class: example string
                  weight: 1.0
                  weight_units: example string
                  length: 1.0
                  width: 1.0
                  height: 1.0
                  dimension_units: example string
                  shipping_label_cost: 1.0
                  shipping_label_currency: example string
                  revenue_eligibility: example string
                  ship_from_country: example string
                  ship_to_country: example string
                  incoterm: example string
                  customs_data:
                    - country_of_origin: example string
                      declared_value: 1.0
                      HS_code: example string
                  duty_amount: 1.0
                  duty_currency: example string
                  ship_date: example string
