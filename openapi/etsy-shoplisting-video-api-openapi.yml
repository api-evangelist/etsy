  /v3/application/shops/{shop_id}/listings/{listing_id}/videos:
    post:
      operationId: uploadListingVideo
      description: '<div class="wt-display-flex-xs wt-align-items-center wt-mt-xs-2 wt-mb-xs-3"><span class="wt-badge wt-badge--notificationPrimary wt-bg-slime-tint wt-mr-xs-2">General Release</span><a class="wt-text-link" href="https://github.com/etsy/open-api/discussions" target="_blank" rel="noopener noreferrer">Report bug</a></div><div class="wt-display-flex-xs wt-align-items-center wt-mt-xs-2 wt-mb-xs-3"><p class="wt-text-body-01 banner-text">This endpoint is ready for production use.</p></div>


        Uploads a new video for a listing, or associates an existing video with a specific listing. You must either provide the `video_id` of an existing video, or the name and binary file data for a video to upload. If providing a `video_id`, the video must already be associated with the same shop as the listing, but it does not need to be currently associated with the listing. '
      tags:
      - ShopListing Video
      parameters:
      - name: shop_id
        in: path
        description: The unique positive non-zero numeric ID for an Etsy Shop.
        required: true
        schema:
          type: integer
          description: The unique positive non-zero numeric ID for an Etsy Shop.
          format: int64
          minimum: 1
        example: 123456
      - name: listing_id
        in: path
        description: The numeric ID for the [listing](/documentation/reference#tag/ShopListing) associated to this transaction.
        required: true
        schema:
          type: integer
          description: The numeric ID for the [listing](/documentation/reference#tag/ShopListing) associated to this transaction.
          format: int64
          minimum: 1
        example: 123456789
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                video_id:
                  type: integer
                  description: The unique ID of a video associated with a listing.
                  format: int64
                  minimum: 1
                video:
                  type: string
                  description: A video file to upload.
                  format: binary
                  nullable: true
                name:
                  type: string
                  description: The file name string for the video to upload.
      responses:
        '201':
          description: The metadata for a file associated with a digital listing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListingVideo'
              examples:
                UploadListingVideo201Example:
                  summary: Default uploadListingVideo 201 response
                  x-microcks-default: true
                  value:
                    video_id: 1
                    height: 1
                    width: 1
                    thumbnail_url: https://www.etsy.com/listing/123456789
                    video_url: https://www.etsy.com/listing/123456789
                    video_state: active
        '404':
          description: A resource could not be found. See the error message for details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorSchema'
              examples:
                UploadListingVideo404Example:
                  summary: Default uploadListingVideo 404 response
                  x-microcks-default: true
                  value:
                    error: example string
        '400':
          description: There was a problem with the request data. See the error message for details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorSchema'
              examples:
                UploadListingVideo400Example:
                  summary: Default uploadListingVideo 400 response
                  x-microcks-default: true
                  value:
                    error: example string
        '403':
